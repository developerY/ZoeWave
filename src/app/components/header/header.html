<header class="fixed top-0 left-0 right-0 z-50 bg-[#fffafd]/90 backdrop-blur-xl border-b border-pink-200/50 shadow-[0_4px_20px_rgba(236,72,153,0.06)]">
  <!-- Top Pastel Rainbow Spectrum Line -->
  <div class="h-1 w-full bg-pastel-rainbow"></div>

  <div class="h-20 max-w-[1440px] mx-auto px-4 sm:px-8 lg:px-12 flex items-center justify-between gap-4">
    <!-- Brand Logo -->
    <div class="flex items-center gap-4">
      <a routerLink="/home" (click)="closeMobileMenu()" class="flex items-center gap-3 group" aria-label="ZoeWave Enterprises Home">
        <div class="h-10 px-2.5 rounded-xl bg-white flex items-center justify-center border border-pink-200 shadow-[0_2px_12px_rgba(236,72,153,0.12)] transition-transform group-hover:scale-105 overflow-hidden">
          <img src="/assets/images/zoewave-logo.png" alt="ZoeWave Logo" class="h-7 w-auto object-contain" referrerpolicy="no-referrer" />
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="font-headline-sm tracking-tight text-slate-900 font-bold">ZoeWave</span>
            <span class="material-symbols-outlined text-[16px] text-pink-500">hub</span>
          </div>
          <span class="font-label-sm text-slate-500 uppercase tracking-widest font-semibold">Frontier Enterprise • Technology Ecosystem</span>
        </div>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <nav class="hidden lg:flex items-center gap-1.5" aria-label="Main Navigation">
      <a routerLink="/home" 
         routerLinkActive="text-slate-900 font-semibold bg-white/90 shadow-xs border border-pink-200/60" 
         [routerLinkActiveOptions]="{exact: true}"
         class="px-4 py-2 font-label-md text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-colors rounded-xl font-medium">
        Home
      </a>
      <a routerLink="/companies" 
         routerLinkActive="text-slate-900 font-semibold bg-white/90 shadow-xs border border-pink-200/60" 
         class="px-4 py-2 font-label-md text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-colors rounded-xl font-medium">
        Companies
      </a>
      <a routerLink="/projects" 
         routerLinkActive="text-slate-900 font-semibold bg-white/90 shadow-xs border border-pink-200/60" 
         class="px-4 py-2 font-label-md text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-colors rounded-xl font-medium">
        Projects
      </a>
      <a routerLink="/believe" 
         routerLinkActive="text-slate-900 font-semibold bg-white/90 shadow-xs border border-pink-200/60" 
         class="px-4 py-2 font-label-md text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-colors rounded-xl font-medium">
        Believe
      </a>
      <a routerLink="/people/ash" 
         routerLinkActive="text-slate-900 font-semibold bg-white/90 shadow-xs border border-pink-200/60" 
         class="px-4 py-2 font-label-md text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-colors rounded-xl font-medium">
        People / Ash
      </a>
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-3">
      <!-- Contact Button -->
      <button type="button" 
              (click)="openContact()"
              class="hidden sm:inline-flex items-center justify-center px-5 py-2 font-label-md text-white bg-gradient-to-r from-pink-500 via-purple-500 to-sky-400 hover:from-pink-600 hover:to-purple-600 transition-all rounded-xl shadow-[0_4px_16px_rgba(236,72,153,0.3)] hover:shadow-[0_4px_24px_rgba(168,85,247,0.4)] cursor-pointer">
        <span class="material-symbols-outlined text-[18px] mr-1.5 text-white">auto_awesome</span>
        Connect
      </button>

      <!-- Ash Profile Avatar link -->
      <a routerLink="/people/ash" 
         title="Siamak (Ash) Ashrafi - Executive Dossier"
         class="hidden md:flex items-center gap-1.5 pl-2 border-l border-pink-200 hover:opacity-85 transition-opacity">
        <img alt="Siamak Ashrafi" 
             class="w-8 h-8 rounded-full object-cover border-2 border-pink-300 shadow-sm" 
             src="/assets/images/ash-avatar.jpg"
             referrerpolicy="no-referrer" />
      </a>

      <!-- Mobile Hamburger Button -->
      <button type="button"
              (click)="toggleMobileMenu()"
              class="lg:hidden p-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-[#eaedff] transition-colors cursor-pointer"
              aria-label="Toggle Navigation Menu">
        <span class="material-symbols-outlined text-[26px]">
          @if (mobileMenuOpen()) {
            close
          } @else {
            menu
          }
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div class="lg:hidden bg-[#faf8ff] border-b border-[#bfc7d5]/40 px-6 py-6 flex flex-col gap-3 shadow-xl animate-fadeIn">
      <a routerLink="/home" 
         (click)="closeMobileMenu()"
         routerLinkActive="text-primary font-bold bg-[#eaedff]" 
         [routerLinkActiveOptions]="{exact: true}"
         class="px-4 py-3 rounded-xl font-label-md text-on-surface hover:bg-[#eaedff] transition-colors flex items-center justify-between">
        <span>Home</span>
        <span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_forward</span>
      </a>
      <a routerLink="/companies" 
         (click)="closeMobileMenu()"
         routerLinkActive="text-primary font-bold bg-[#eaedff]" 
         class="px-4 py-3 rounded-xl font-label-md text-on-surface hover:bg-[#eaedff] transition-colors flex items-center justify-between">
        <span>Companies</span>
        <span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_forward</span>
      </a>
      <a routerLink="/projects" 
         (click)="closeMobileMenu()"
         routerLinkActive="text-primary font-bold bg-[#eaedff]" 
         class="px-4 py-3 rounded-xl font-label-md text-on-surface hover:bg-[#eaedff] transition-colors flex items-center justify-between">
        <span>Projects</span>
        <span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_forward</span>
      </a>
      <a routerLink="/believe" 
         (click)="closeMobileMenu()"
         routerLinkActive="text-primary font-bold bg-[#eaedff]" 
         class="px-4 py-3 rounded-xl font-label-md text-on-surface hover:bg-[#eaedff] transition-colors flex items-center justify-between">
        <span>Believe (Manifesto)</span>
        <span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_forward</span>
      </a>
      <a routerLink="/people/ash" 
         (click)="closeMobileMenu()"
         routerLinkActive="text-primary font-bold bg-[#eaedff]" 
         class="px-4 py-3 rounded-xl font-label-md text-on-surface hover:bg-[#eaedff] transition-colors flex items-center justify-between">
        <span>People / Ash</span>
        <span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_forward</span>
      </a>
      <div class="pt-2 border-t border-[#bfc7d5]/30">
        <button type="button" 
                (click)="openContact()"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-sky-400 hover:opacity-95 text-white font-label-md flex items-center justify-center gap-2 shadow-md">
          <span class="material-symbols-outlined text-[20px]">bolt</span>
          Initiate Contact / Joint Ventures
        </button>
      </div>
    </div>
  }
</header>
